<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Employee | Workflow Automation</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #eef2ff 0%, #f8faff 55%, #e0e7ff 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #1f2937;
    }
    .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 10px 17px;
        border-radius: 9px;
        background: #ffffff;
        color: #4f46e5;
        border: 1px solid #c7d2fe;
        text-decoration: none;
        font-size: 0.86rem;
        font-weight: 650;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .back-btn:hover {
        background: #4f46e5;
        border-color: #4f46e5;
        color: #ffffff;
    }
    /* Navbar */
    .navbar {
        background: rgba(255, 255, 255, 0.96);
        border-bottom: 1px solid #e5e7eb;
    }

    .navbar-brand {
        color: #4f46e5 !important;
        font-weight: 750;
        letter-spacing: 0.3px;
    }

    .navbar-label {
        color: #6b7280;
        font-size: 0.84rem;
    }

    /* Main */
    .page-section {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 45px 20px;
    }

    /* Card */
    .edit-card {
        width: 100%;
        max-width: 650px;
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(31, 41, 55, 0.12);
    }

    /* Header */
    .edit-header {
        padding: 31px 38px;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: #ffffff;
    }

    .header-icon {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.45rem;
        margin-bottom: 16px;
    }

    .edit-header h1 {
        font-size: 1.8rem;
        font-weight: 750;
        margin-bottom: 6px;
    }

    .edit-header p {
        margin: 0;
        opacity: 0.85;
        font-size: 0.9rem;
    }

    /* Form */
    .edit-form {
        padding: 34px 38px 38px;
    }

    .form-section {
        margin-bottom: 25px;
    }

    .form-section-title {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #374151;
        font-size: 0.82rem;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 0.45px;
        margin-bottom: 17px;
    }

    .section-line {
        height: 1px;
        flex: 1;
        background: #e5e7eb;
    }

    .form-group {
        margin-bottom: 19px;
    }

    .form-group:last-child {
        margin-bottom: 0;
    }

    .form-label {
        color: #374151;
        font-size: 0.8rem;
        font-weight: 650;
        margin-bottom: 7px;
    }

    .form-control,
    .form-select {
        min-height: 47px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 9px 13px;
        font-size: 0.88rem;
        color: #1f2937;
        transition: all 0.2s ease;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .readonly-field {
        background: #f8fafc;
        color: #64748b;
        cursor: not-allowed;
    }

    .field-help {
        color: #9ca3af;
        font-size: 0.73rem;
        margin-top: 6px;
    }

    /* Two Columns */
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 17px;
    }

    /* Actions */
    .form-actions {
        display: flex;
        gap: 11px;
        margin-top: 30px;
        padding-top: 24px;
        border-top: 1px solid #e5e7eb;
    }

    .update-btn {
        flex: 1;
        min-height: 49px;
        border: none;
        border-radius: 10px;
        background: #4f46e5;
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: 700;
        box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2);
        transition: all 0.2s ease;
    }

    .update-btn:hover {
        background: #4338ca;
        transform: translateY(-1px);
        box-shadow: 0 11px 24px rgba(79, 70, 229, 0.28);
    }

    .cancel-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 49px;
        padding: 0 20px;
        border-radius: 10px;
        background: #ffffff;
        border: 1px solid #d1d5db;
        color: #4b5563;
        text-decoration: none;
        font-size: 0.88rem;
        font-weight: 650;
        transition: all 0.2s ease;
    }

    .cancel-btn:hover {
        background: #f9fafb;
        border-color: #9ca3af;
        color: #1f2937;
    }

    /* Mobile */
    @media (max-width: 576px) {

        .page-section {
            padding: 25px 15px;
        }

        .edit-header {
            padding: 27px 23px;
        }

        .edit-header h1 {
            font-size: 1.55rem;
        }

        .edit-form {
            padding: 28px 22px 30px;
        }

        .form-row {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .form-actions {
            flex-direction: column-reverse;
        }

        .cancel-btn,
        .update-btn {
            width: 100%;
        }
    }
</style>

</head> <body>
<!-- Navigation -->
<nav class="navbar py-3">
    <div class="container-fluid px-4">

        <a class="navbar-brand" href="{% url 'loaddashboard' %}">
            Workflow Automation
        </a>


        <div style="display: flex; gap: 60px; align-items: center;">
        <span class="navbar-label">
            Admin • Employee Management
        </span>

        <a href="{% url 'allemployees' %}" class="back-btn">
            ← Go Back
        </a>
        </div>

    </div>
</nav>


<!-- Main -->
<main class="page-section">

    <div class="edit-card">

        <!-- Header -->
        <div class="edit-header">

            <!-- <div class="header-icon">
                ✏️
            </div> -->

            <h1>Edit Employee</h1>

            <p>
                Update the employee's account and organizational details.
            </p>

        </div>


        <!-- Form -->
        <div class="edit-form">

            <form action="{% url 'editemployee' %}" method="post">

                {% csrf_token %}


                <!-- Account Information -->
                <div class="form-section">

                    <div class="form-section-title">

                        Account Information

                        <span class="section-line"></span>

                    </div>


                    <!-- ID -->
                    <div class="form-group">

                        <label class="form-label" for="user-id">
                            Employee ID
                        </label>

                        <input
                            type="number"
                            class="form-control readonly-field"
                            id="user-id"
                            name="user_id"
                            value="{{user.id}}"
                            readonly
                        >

                        <div class="field-help">
                            Employee ID cannot be changed.
                        </div>

                    </div>


                    <!-- Name / Username -->
                    <div class="form-row">

                        <div class="form-group">

                            <label class="form-label" for="name">
                                Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                value="{{user.name}}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label class="form-label" for="username">
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                value="{{user.username}}"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label class="form-label" for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            value="{{user.password}}"
                            required
                        >

                    </div>

                </div>


                <!-- Organization Information -->
                <div class="form-section">

                    <div class="form-section-title">

                        Organization Details

                        <span class="section-line"></span>

                    </div>


                    <!-- Role -->
                    <div class="form-group">

                        <label class="form-label" for="role">
                            Role
                        </label>

                        <select
                            class="form-select"
                            id="role"
                            name="role"
                            required
                        >

                            {% for i in roles %}

                            <option
                                value="{{i.role_name}}"
                                {% if i.role_name == user.role %}selected{% endif %}
                            >
                                {{i.role_name}}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Department -->
                    <div class="form-group">

                        <label class="form-label" for="department">
                            Department
                        </label>

                        <select
                            class="form-select"
                            id="department"
                            name="departmentId"
                            required
                        >

                            {% for i in depts %}

                            <option
                                value="{{i.id}}"
                                {% if i.id == user.department_id %}selected{% endif %}
                            >
                                {{i.dept_name}}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <!-- Actions -->
                <div class="form-actions">

                    <a href="{% url 'loaddashboard' %}"
                       class="cancel-btn">
                        ← Cancel
                    </a>

                    <input
                        type="submit"
                        value="Update Employee"
                        class="update-btn"
                    >

                </div>

            </form>

        </div>

    </div>

</main>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body> </html>
