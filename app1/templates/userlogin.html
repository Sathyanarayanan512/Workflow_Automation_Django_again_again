<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Workflow Automation</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #eef2ff 0%, #f8faff 50%, #e0e7ff 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar {
        background: rgba(255, 255, 255, 0.95);
    }

    .navbar-brand {
        font-weight: 700;
        color: #4f46e5 !important;
        letter-spacing: 0.3px;
    }

    .login-section {
        min-height: calc(100vh - 72px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .login-card {
        width: 100%;
        max-width: 450px;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 22px;
        padding: 42px;
        box-shadow: 0 20px 60px rgba(31, 41, 55, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 18px;
        border-radius: 18px;
        background: #eef2ff;
        color: #4f46e5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
    }

    .login-header h1 {
        font-size: 2rem;
        font-weight: 750;
        color: #111827;
        margin-bottom: 8px;
    }

    .login-header p {
        color: #6b7280;
        margin-bottom: 0;
        font-size: 0.95rem;
    }

    .message-box {
        background: #fff7ed;
        border: 1px solid #fed7aa;
        color: #c2410c;
        border-radius: 10px;
        padding: 12px 15px;
        margin-bottom: 22px;
        font-size: 0.95rem;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        font-weight: 600;
        color: #374151;
        margin-bottom: 7px;
    }

    .form-control {
        min-height: 49px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 10px 14px;
        color: #1f2937;
        transition: all 0.2s ease;
    }

    .form-control:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .login-btn {
        width: 100%;
        min-height: 50px;
        border: none;
        border-radius: 10px;
        background: #4f46e5;
        color: white;
        font-weight: 600;
        font-size: 1rem;
        margin-top: 5px;
        transition: all 0.25s ease;
        box-shadow: 0 8px 20px rgba(79, 70, 229, 0.22);
    }

    .login-btn:hover {
        background: #4338ca;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(79, 70, 229, 0.3);
    }

    .register-link {
        text-align: center;
        margin-top: 23px;
        color: #6b7280;
        font-size: 0.92rem;
    }

    .register-link a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 600;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 576px) {
        .login-section {
            padding: 25px 15px;
        }

        .login-card {
            padding: 32px 22px;
            border-radius: 18px;
        }

        .login-header h1 {
            font-size: 1.7rem;
        }
    }
</style>

</head> <body>
<!-- Navigation -->
<nav class="navbar shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand" href="#">
            Workflow Automation
        </a>

        <span class="text-muted small d-none d-sm-block">
            Approval Engine
        </span>
    </div>
</nav>

<!-- Login Section -->
<main class="login-section">

    <div class="login-card">

        <!-- Header -->
        <div class="login-header">

            <!-- <div class="login-icon">
                🔐
            </div> -->

            <h1>Welcome Back</h1>

            <p>
                Sign in to access your workflow dashboard
            </p>

        </div>

        <!-- Django Message -->
        {% if message %}
        <div class="message-box">
            {{message}}
        </div>
        {% endif %}

        <!-- Login Form -->
        <form action="{% url 'userlogin' %}" method="post">

            {% csrf_token %}

            <!-- Username -->
            <div class="form-group">
                <label class="form-label" for="username">
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="password">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <!-- Submit -->
            <input
                type="submit"
                value="Login"
                class="login-btn"
            >

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="{% url 'loadregister' %}">Create an account</a>
        </div>

    </div>

</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body> </html>
